<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>StreamScript AI — Salas activas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%237dd3fc'/%3E%3Crect x='6' y='10' width='2.4' height='8' rx='1.2' fill='%230a0c11'/%3E%3Crect x='10.8' y='6' width='2.4' height='12' rx='1.2' fill='%230a0c11'/%3E%3Crect x='15.6' y='9' width='2.4' height='9' rx='1.2' fill='%230a0c11'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="theme.css" />
<style>
  body { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 3rem; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.75rem; }
  h1 { font-size: 1.05rem; font-weight: 600; color: var(--text-dim); margin: 1.75rem 0 0.9rem; }
  .room {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.1rem;
    margin: 0.6rem 0; display:flex; justify-content:space-between; align-items:center;
    background: var(--surface); transition: border-color 0.15s, transform 0.15s;
  }
  .room:hover { border-color: var(--accent); transform: translateY(-1px); }
  .room a.title { color: var(--text); text-decoration: none; font-weight: 600; font-size: 1.02rem; }
  .room a.title:hover { color: var(--accent); }
  .status { font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 999px; font-weight: 600; display:inline-flex; align-items:center; gap:0.35rem; }
  .status.active { background: var(--ok-bg); color: var(--ok-fg); }
  .status.error { background: var(--err-bg); color: var(--err-fg); }
  .status.starting { background: var(--warn-bg); color: var(--warn-fg); }
  .status.closed { background: var(--bg-alt); color: var(--text-faint); }
  .meta { font-size: 0.78rem; color: var(--text-faint); margin-top: 0.25rem; }
  .links a { margin-right: 0.9rem; font-size: 0.82rem; color: var(--text-dim); text-decoration: none; }
  .links a:hover { color: var(--accent); }
  #empty { opacity: 0.6; border: 1px dashed var(--border); border-radius: var(--radius); padding: 1.5rem; text-align: center; }
  #empty code { color: var(--accent); }
  footer { margin-top: 2.5rem; font-size: 0.82rem; display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: 0.75rem; }
</style>
</head>
<body>
<header>
  <span class="brand">
    <svg width="24" height="24" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#7dd3fc"/><rect x="6" y="10" width="2.4" height="8" rx="1.2" fill="#0a0c11"/><rect x="10.8" y="6" width="2.4" height="12" rx="1.2" fill="#0a0c11"/><rect x="15.6" y="9" width="2.4" height="9" rx="1.2" fill="#0a0c11"/></svg>
    StreamScript AI <span class="tag">salas activas</span>
  </span>
</header>

<div id="rooms"></div>
<p id="empty" style="display:none;">No hay salas activas todavía. Creá una con <code>POST /api/rooms</code>.</p>
<footer>
  <a href="dashboard.html">Ver panel de producción →</a>
  <a class="nerdearla-credit" href="https://nerdearla.com/" target="_blank" rel="noopener">
    <img src="assets/nerdearla-wordmark.webp" alt="Nerdearla" /> Vibeathon 2026
  </a>
</footer>

<script>
function esc(s) {
  const div = document.createElement('div');
  div.textContent = s ?? '';
  return div.innerHTML;
}

const statusLabel = { active: 'en vivo', starting: 'iniciando', error: 'error', closed: 'cerrada' };

async function load() {
  const res = await fetch('/api/rooms');
  const rooms = await res.json();
  const container = document.getElementById('rooms');
  container.innerHTML = '';
  document.getElementById('empty').style.display = rooms.length ? 'none' : 'block';
  for (const room of rooms) {
    const div = document.createElement('div');
    div.className = 'room';
    const dot = room.status === 'active' ? '<span class="live-dot"></span>' : '';
    div.innerHTML = `
      <div>
        <a class="title" href="watch.html?room=${encodeURIComponent(room.id)}">${esc(room.title || room.id)}</a>
        <div class="meta">${esc(room.source_lang)} → ${esc(room.target_langs.join(', '))}</div>
        <div class="links">
          <a href="overlay.html?room=${encodeURIComponent(room.id)}">overlay OBS</a>
          <a href="qr.html?room=${encodeURIComponent(room.id)}">QR para proyectar</a>
        </div>
      </div>
      <span class="status ${esc(room.status)}">${dot}${esc(statusLabel[room.status] || room.status)}</span>
    `;
    container.appendChild(div);
  }
}
load();
setInterval(load, 4000);
</script>
</body>
</html>

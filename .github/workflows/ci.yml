name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest tests -v
        env:
          # unset in CI on purpose: exercises the MockProvider path, the
          # same way the tests run locally without a real Gemini key.
          GEMINI_API_KEY: ""

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plain `docker build` on purpose, not `docker compose build`: compose
      # also resolves docker-compose.yml's `env_file: .env`, which doesn't
      # exist in CI (it's gitignored, per-deployment) and isn't needed just
      # to confirm the image builds.
      - run: docker build -f backend/Dockerfile -t streamscript-ai .
